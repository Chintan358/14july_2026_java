
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tops Technologies - Login</title>

    <style>
        /* =========================
           GENERAL CSS
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f4f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            background-color: #1e3a8a;
            color: white;
            height: 80px;

            display: flex;
            align-items: center;

            padding: 0 50px;
        }

        .logo {
            width: 50px;
            height: 50px;

            background-color: white;
            color: #1e3a8a;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;

            margin-right: 15px;
        }

        .company-name {
            font-size: 26px;
            font-weight: bold;
        }


        /* =========================
           MAIN SECTION
        ========================== */

        main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;
        }


        /* =========================
           LOGIN BOX
        ========================== */

        .login-box {
            width: 380px;

            background-color: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .login-box h2 {
            text-align: center;

            color: #1e3a8a;

            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }


        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #1e3a8a;
        }


        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-btn {
            width: 100%;

            padding: 12px;

            background-color: #1e3a8a;

            color: white;

            border: none;

            border-radius: 5px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #162d6b;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            background-color: #1e3a8a;

            color: white;

            text-align: center;

            padding: 18px;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 600px) {

            header {
                padding: 0 20px;
            }

            .company-name {
                font-size: 21px;
            }

            main {
                padding: 20px;
            }

            .login-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo">
            TT
        </div>

        <div class="company-name">
            Tops Technologies
        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>

        <div class="login-box">

            <h2>Login</h2>

            <p>Welcome to Tops Technologies</p>

            <form>

                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" name="username" placeholder="Enter your username" required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                </div>


                <!-- Login Button -->

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        &copy; 2026 Tops Technologies. All Rights Reserved.

    </footer>

</body>

</html>
