<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .textfield {
            width: 150px;
            height: 30px;
            border: 1px solid black;
            border-radius: 5px;
            background-color: burlywood;
            color: cadetblue;
            box-shadow: 3px 3px;
        }
    </style>
</head>

<body>
    <fieldset>
        <legend>Registration form</legend>
        <form action="" method="post">


            <label for="uname">Username</label>
            <input type="text" placeholder="enter username" id="uname" name="uname" class="textfield">
            <br>
            <br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="textfield">

            <br>
            <br>
            <label for="">Password</label>
            <input type="password" name="pass" class="textfield">

            <br>
            <br>

            <label for="">Gender</label>
            <input type="radio" name="gender" value="male" checked>Male
            <input type="radio" name="gender" value="Female">Female


            <br>
            <br>

            <label for="">Languages</label>
            <input type="checkbox" name="lang" value="guj">Gujarati
            <input type="checkbox" name="lang" value="hin">Hindi
            <input type="checkbox" name="lang" value="eng">English

            <br>
            <br>

            <label for="">Country</label>
            <select name="" id="">
                <option value="">India</option>
                <option value="">USA</option>
                <option value="">Canada</option>
            </select>

            <br><br>

            <label for="">BirthDate</label>
            <input type="date">

            <br>
            <br>

            <label for="">Color</label>
            <input type="color">

            <br>
            <br>

            <label for="">Address</label>
            <textarea name="" id=""></textarea>

            <br>
            <br>

            <input type="submit">
            <input type="reset">


        </form>
    </fieldset>

</body>

</html>
